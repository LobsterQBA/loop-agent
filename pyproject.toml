[project]
name = "loop-agent"
version = "0.1.0"
description = "A small, readable agent system: loop, tools, memory, and trace."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Leo Zhao" }]
dependencies = []

[project.optional-dependencies]
live = ["openai>=1.50"]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
loop-agent = "agent_system.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
